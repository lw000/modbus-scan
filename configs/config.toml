[server]
host = "127.0.0.1"
port = 8080
read_header_timeout_sec = 5
read_timeout_sec = 15
write_timeout_sec = 30
idle_timeout_sec = 60
shutdown_timeout_sec = 15

[database]
path = "../data/modbus-scan.db"
busy_timeout_ms = 5000

[log]
level = "info"
format = "text"
console = true
file = "../logs/modbus-scan.log"
max_size_mb = 50
max_backups = 10
max_age_days = 30
compress = true
