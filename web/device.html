<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备详情</title><link rel="stylesheet" href="/css/app.css"></head>
<body>
<header><a href="/">← 设备列表</a><h1 id="title">设备详情</h1><div id="controls" class="actions"><button data-action="start">启动</button><button data-action="stop">停止</button><button data-action="restart">重启</button></div></header>
<main><div id="notice" class="notice" hidden></div>
<section class="card" id="summary"></section>
<section class="card"><form id="device-kafka-form"><h2>Kafka 推送</h2><label class="inline-check">启用<input id="device-kafka-enabled" type="checkbox"></label><label>Topic<input id="device-kafka-topic" maxlength="249"></label><fieldset class="kafka-mode-row"><legend>推送模式</legend><label><input type="radio" name="kafka-mode" value="change" checked>变化推送</label><label><input type="radio" name="kafka-mode" value="full">全量推送</label></fieldset><label>全量周期（秒）<input id="device-kafka-interval" type="number" min="1" max="86400" value="1"></label><div class="actions"><button type="submit">保存 Kafka 配置</button></div></form></section>
<section class="card"><div class="toolbar"><h2>点位配置</h2><input id="search" placeholder="搜索 TagName"><select id="reg-type"><option value="">全部类型</option><option>HoldingReg</option><option>InputReg</option><option>CoilStatus</option><option>InputStatus</option></select><button id="add-point">添加点位</button><button id="delete-page" class="danger" disabled>删除当前页</button><label class="button">导入 CSV<input id="csv-file" type="file" accept=".csv,text/csv" hidden></label><a id="export" class="button">导出 CSV</a></div>
<div class="table-scroll"><table id="points-table"><colgroup><col data-column="tag-name"><col data-column="reg-type"><col data-column="address"><col data-column="data-type"><col data-column="bit-offset"><col data-column="bit-len"><col data-column="writeable"><col data-column="description"><col data-column="actions"></colgroup><thead><tr><th>TagName<span class="column-resizer" data-resize="tag-name"></span></th><th>类型<span class="column-resizer" data-resize="reg-type"></span></th><th>地址<span class="column-resizer" data-resize="address"></span></th><th>数据类型<span class="column-resizer" data-resize="data-type"></span></th><th>位偏移<span class="column-resizer" data-resize="bit-offset"></span></th><th>位长度<span class="column-resizer" data-resize="bit-len"></span></th><th>读写<span class="column-resizer" data-resize="writeable"></span></th><th>描述<span class="column-resizer" data-resize="description"></span></th><th class="sticky-actions">操作<span class="column-resizer" data-resize="actions"></span></th></tr></thead><tbody id="points"></tbody></table></div>
<div class="pagination"><label>每页<select id="page-size"><option>10</option><option selected>20</option><option>50</option><option>100</option><option>200</option><option value="500">500</option></select></label><button id="prev-page" type="button">上一页</button><span id="page-status" aria-live="polite"></span><button id="next-page" type="button">下一页</button></div></section></main>
<dialog id="point-dialog"><form id="point-form"><h2>点位配置</h2><input type="hidden" id="point-id"><label>TagName<input id="tag-name" required></label><label>描述<input id="description" maxlength="255"></label><label>寄存器类型<select id="point-reg-type"><option>HoldingReg</option><option>InputReg</option><option>CoilStatus</option><option>InputStatus</option></select></label><div class="form-row two-columns"><label>地址<input id="point-address" type="number" min="0" max="65535" required></label><label>数据类型<select id="data-type"><option>Bool</option><option>Int16</option><option>UInt16</option><option>Int32</option><option>UInt32</option><option>Float32</option><option>Double</option></select></label></div><div class="form-row two-columns"><label>BitOffset<input id="bit-offset" type="number" min="0" value="0"></label><label>BitLen<input id="bit-len" type="number" min="0" value="0"></label></div><label class="writeable-field">允许写入<input id="writeable" type="checkbox"></label><div class="actions dialog-actions"><button type="button" data-close>取消</button><button type="submit">保存</button></div></form></dialog>
<dialog id="realtime-dialog" class="realtime-dialog"><section><h2 id="realtime-tag">实时值</h2><p id="realtime-description"></p><div class="realtime-formats"><div><span>十进制</span><strong id="realtime-decimal">—</strong></div><div><span>二进制</span><code id="realtime-binary">—</code></div><div><span>十六进制</span><code id="realtime-hexadecimal">—</code></div></div><div class="realtime-reading"><span id="realtime-updated">--</span><span id="realtime-status">连接中</span></div><div class="realtime-chart-toolbar"><label for="realtime-window">时间窗口</label><select id="realtime-window"><option value="1">1 分钟</option><option value="5" selected>5 分钟</option><option value="10">10 分钟</option><option value="30">30 分钟</option></select></div><canvas id="realtime-chart" width="800" height="320"></canvas><div class="actions dialog-actions"><button id="close-realtime" type="button">关闭</button></div></section></dialog>
<script src="/js/api.js"></script><script src="/js/device.js"></script>
</body></html>
