<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modbus 设备管理</title><link rel="stylesheet" href="/css/app.css"></head>
<body>
<header><h1>Modbus 设备管理</h1><button id="kafka-settings">Kafka 设置</button><button id="add-device">添加设备</button></header>
<main>
  <div id="notice" class="notice" hidden></div>
  <section class="card"><table><thead><tr><th>名称</th><th>地址</th><th>状态</th><th>点位</th><th>最后采集</th><th>操作</th></tr></thead><tbody id="devices"></tbody></table><p id="empty">暂无设备，请添加设备。</p></section>
</main>
<dialog id="device-dialog"><form id="device-form"><h2>设备配置</h2><input type="hidden" id="device-id"><label>名称<input id="name" required maxlength="128"></label><label>地址<input id="address" required value="127.0.0.1"></label><label>端口<input id="port" required type="number" min="1" max="65535" value="502"></label><label>Slave ID<input id="slave-id" required type="number" min="1" max="247" value="1"></label><label>字节序<select id="byte-order"><option>ABCD</option><option>DCBA</option><option>CDAB</option><option>BADC</option></select></label><label>超时（秒）<input id="timeout" type="number" min="1" value="5"></label><label>采集周期（毫秒）<input id="interval" type="number" min="100" value="2000"></label><div class="actions"><button type="button" data-close>取消</button><button type="submit">保存</button></div></form></dialog>
<dialog id="kafka-dialog"><form id="kafka-form" class="kafka-form-grid"><h2 class="full-row">Kafka 设置</h2><p class="full-row">状态：<span id="kafka-state" class="badge">disabled</span></p><p id="kafka-error" class="full-row"></p><label class="inline-check full-row">启用<input id="kafka-enabled" type="checkbox"></label><label>Brokers（每行一个）<textarea id="kafka-brokers" rows="4"></textarea></label><label>Client ID<input id="kafka-client-id" value="modbus-scan"></label><label>Kafka 版本<input id="kafka-version" value="3.0.0"></label><label>安全协议<select id="kafka-security"><option value="">无</option><option>SASL_PLAINTEXT</option><option>SSL</option><option>SASL_SSL</option></select></label><label>SASL 机制<select id="kafka-mechanism"><option value="">无</option><option>PLAIN</option><option>SCRAM-SHA-256</option><option>SCRAM-SHA-512</option></select></label><label>SASL 用户名<input id="kafka-username"></label><label>SASL 密码（留空保留）<input id="kafka-password" type="password"></label><label>清除密码<input id="kafka-clear-password" type="checkbox"></label><label>CA 文件<input id="kafka-ca"></label><label>客户端证书<input id="kafka-cert"></label><label>客户端私钥<input id="kafka-key"></label><label>主机名校验<select id="kafka-endpoint"><option value="https">https</option><option value="none">none</option></select></label><label>队列容量<input id="kafka-queue" type="number" min="1" max="100000" value="1000"></label><div class="actions dialog-actions full-row"><button type="button" data-kafka-close>取消</button><button type="submit">保存</button></div></form></dialog>
<script src="/js/api.js"></script><script src="/js/devices.js"></script>
</body></html>
